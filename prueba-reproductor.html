<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party - Prueba HLS</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 1100px;
      margin: auto;
    }

    h1 { color: #53fc18; }

    .reproductor {
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button, input {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
    }

    button {
      background: #53fc18;
      color: #101010;
      cursor: pointer;
      font-weight: bold;
    }

    input {
      flex: 1;
      min-width: 220px;
      background: #202020;
      color: white;
    }

    #estado {
      color: #ccc;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <h1>Mi Watch Party</h1>
    <p>Reproductor propio · Prueba de HLS</p>

    <div class="reproductor">
      <video id="video" controls playsinline></video>
    </div>

    <div class="controles">
      <button id="cargar">Cargar video de prueba</button>
      <input
        id="url"
        type="url"
        placeholder="URL de una fuente HLS (.m3u8)"
      >
      <button id="cargarUrl">Cargar URL</button>
    </div>

    <p id="estado">Preparado para cargar una fuente de prueba.</p>
  </main>

  <script>
    const video = document.getElementById("video");
    const urlInput = document.getElementById("url");
    const estado = document.getElementById("estado");

    let hls = null;

function cargarHLS(direccion) {
  // Cancelar cualquier carga anterior
  if (hls) {
    hls.destroy();
    hls = null;
  }

  const url = direccion.trim();

  // Validar que se haya ingresado una URL
  if (!url) {
    estado.textContent = "Ingresá una URL de video HLS.";
    return;
  }

  // Validar formato de la dirección
  let urlValidada;

  try {
    urlValidada = new URL(url);
  } catch {
    estado.textContent = "La URL no es válida. Revisá el enlace.";
    return;
  }

  if (!["http:", "https:"].includes(urlValidada.protocol)) {
    estado.textContent = "La URL debe comenzar con http:// o https://.";
    return;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  estado.textContent = "Conectando con la fuente de video...";

  if (Hls.isSupported()) {
    hls = new Hls({
      manifestLoadingTimeOut: 15000,
      manifestLoadingMaxRetry: 2,
      levelLoadingTimeOut: 15000,
      fragLoadingTimeOut: 20000
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (!data.fatal) return;

      switch (data.type) {
        case Hls.ErrorTypes.NETWORK_ERROR:
          estado.textContent =
            "Error de conexión. El servidor puede estar caído, bloquear el acceso o no permitir CORS.";
          break;

        case Hls.ErrorTypes.MEDIA_ERROR:
          estado.textContent =
            "Error al procesar el video. La fuente podría tener un formato incompatible.";
          break;

        default:
          estado.textContent =
            "No se pudo cargar esta fuente. Revisá la URL y los permisos del servidor.";
          break;
      }

      console.error("Error HLS:", {
        type: data.type,
        details: data.details,
        fatal: data.fatal,
        url: urlValidada.href
      });

      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        hls.startLoad();
      }
    });

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      estado.textContent =
        "¡Fuente cargada! Presioná Play para reproducir.";
    });

    hls.on(Hls.Events.MEDIA_ATTACHED, () => {
      estado.textContent = "Reproductor conectado. Cargando video...";
    });

    hls.loadSource(urlValidada.href);
    hls.attachMedia(video);

  } else if (
    video.canPlayType("application/vnd.apple.mpegurl")
  ) {
    video.src = urlValidada.href;

    video.onloadedmetadata = () => {
      estado.textContent =
        "¡Fuente cargada! Presioná Play para reproducir.";
    };

    video.onerror = () => {
      estado.textContent =
        "No se pudo reproducir la fuente. Puede ser un problema de conexión, formato o permisos.";
      console.error("Error del reproductor nativo:", video.error);
    };

  } else {
    estado.textContent =
      "Este navegador no admite HLS en este reproductor.";
  }
}
    document.getElementById("cargar").onclick = () => {
      const demo =
        "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

      urlInput.value = demo;
      cargarHLS(demo);
    };

    document.getElementById("cargarUrl").onclick = () => {
      const direccion = urlInput.value.trim();

      try {
        const url = new URL(direccion);

        if (url.protocol !== "https:" && url.protocol !== "http:") {
          throw new Error("Protocolo no permitido");
        }

        cargarHLS(url.href);
      } catch {
        estado.textContent = "Ingresá una URL válida.";
      }
    };
  </script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase,
    ref,
    onValue,
    set
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZq0EfZNPCn_gTJIu61pxAGRDpOYvDvkA",
    authDomain: "mi-watch-party.firebaseapp.com",
    databaseURL: "https://mi-watch-party-default-rtdb.firebaseio.com",
    projectId: "mi-watch-party",
    appId: "1:854788364639:web:74f134423e5d3142b6beea",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const videoUrlRef = ref(db, "watchparty/videoUrl");
  const inputUrl = document.getElementById("url");

  onValue(
  videoUrlRef,
  (snapshot) => {
    const url = snapshot.val();

    console.log("Firebase respondió. URL recibida:", url);

    if (url && inputUrl && inputUrl.value !== url) {
      inputUrl.value = url;
      cargarHLS(url);
    }
  },
  (error) => {
    console.error("Error al leer Firebase:", error);
  }
);

  onAuthStateChanged(auth, (user) => {
    console.log(user ? "Sesión iniciada" : "Sin sesión iniciada");
  });
</script>
</body>
</html>
