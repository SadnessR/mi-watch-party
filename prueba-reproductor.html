<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party - Prueba HLS</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      max-width: 1100px;
      margin: auto;
    }

    h1 { color: #53fc18; }

    .reproductor {
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button, input {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
    }

    button {
      background: #53fc18;
      color: #101010;
      cursor: pointer;
      font-weight: bold;
    }

    input {
      flex: 1;
      min-width: 220px;
      background: #202020;
      color: white;
    }

    #estado {
      color: #ccc;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <h1>Mi Watch Party</h1>
    <p>Reproductor propio · Prueba de HLS</p>

    <div class="reproductor">
      <video id="video" controls playsinline></video>
    </div>

    <div class="controles">
      <button id="cargar">Cargar video de prueba</button>
      <input
        id="url"
        type="url"
        placeholder="URL de una fuente HLS (.m3u8)"
      >
      <button id="cargarUrl">Cargar URL</button>
    </div>

    <p id="estado">Preparado para cargar una fuente de prueba.</p>
  </main>

  <script>
    const video = document.getElementById("video");
    const urlInput = document.getElementById("url");
    const estado = document.getElementById("estado");

    let hls = null;

    function cargarHLS(direccion) {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();

      estado.textContent = "Cargando fuente...";

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(direccion);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          estado.textContent =
            "Fuente cargada. Presioná Play para reproducir.";
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            estado.textContent =
              "Error al cargar el video: " + data.type +
              ". Revisá la fuente o la consola.";
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = direccion;
        estado.textContent =
          "Fuente cargada. Presioná Play para reproducir.";
      } else {
        estado.textContent =
          "Este navegador no admite HLS en este reproductor.";
      }
    }

    document.getElementById("cargar").onclick = () => {
      const demo =
        "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

      urlInput.value = demo;
      cargarHLS(demo);
    };

    document.getElementById("cargarUrl").onclick = () => {
      const direccion = urlInput.value.trim();

      try {
        const url = new URL(direccion);

        if (url.protocol !== "https:" && url.protocol !== "http:") {
          throw new Error("Protocolo no permitido");
        }

        cargarHLS(url.href);
      } catch {
        estado.textContent = "Ingresá una URL válida.";
      }
    };
  </script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase,
    ref,
    onValue,
    set
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZq0EfZNPCn_gTJIu61pxAGRDpOYvDvkA",
    authDomain: "mi-watch-party.firebaseapp.com",
    databaseURL: "https://mi-watch-party-default-rtdb.firebaseio.com",
    projectId: "mi-watch-party",
    appId: "1:854788364639:web:74f134423e5d3142b6beea",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const videoUrlRef = ref(db, "watchparty/videoUrl");
  const inputUrl = document.getElementById("url");

  onValue(videoUrlRef, (snapshot) => {
    const url = snapshot.val();

    if (url && inputUrl && inputUrl.value !== url) {
      inputUrl.value = url;
      cargarHLS(url);
    }
  });

  onAuthStateChanged(auth, (user) => {
    console.log(user ? "Sesión iniciada" : "Sin sesión iniciada");
  });
</script>
</body>
</html>
